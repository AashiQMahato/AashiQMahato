<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d">
<title id="t">AI Weather Dashboard</title>
<desc id="d">AI · Dashboard. OpenAI-powered weather insights with GPS location, a 10-day forecast with charts and a glassmorphism UI. Built with Next.js, OpenAI, Tailwind, REST API.</desc>
<defs><filter id="cSh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5.1" stdDeviation="7.7" flood-color="#000" flood-opacity="0.1"/></filter>
<linearGradient id="cEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,0.9)"/><stop offset=".18" stop-color="rgba(0,0,0,0.08)"/><stop offset="1" stop-color="rgba(0,0,0,0.08)"/></linearGradient><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0095D9"/><stop offset="1" stop-color="#0071E3"/></linearGradient>
<linearGradient id="ish" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI Variable Display','Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:'SF Mono',ui-monospace,SFMono-Regular,Menlo,'Cascadia Code',Consolas,'Liberation Mono',monospace}
.rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<rect x="10.5" y="6.5" width="459" height="279" rx="24" fill="#F5F5F7" filter="url(#cSh)"/>
<rect x="10.5" y="6.5" width="459" height="279" rx="24" fill="none" stroke="url(#cEdge)"/>
<g class="rise">
  <rect x="38" y="34" width="54" height="54" rx="13.5" fill="url(#ig)"/>
  <rect x="38" y="34" width="54" height="54" rx="13.5" fill="url(#ish)"/>
  <path transform="translate(50 46) scale(1.25)" d="M7.5 19h9.5a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.9 1.2A3.4 3.4 0 0 0 7.5 19zM5 6.5l1 1M10.5 3.5V5M3 11.5h1.5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="424" cy="52" r="16" fill="rgba(120,120,128,0.12)"/>
  <path d="M419 57l10-10M421 47h8v8" fill="none" stroke="#0071E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g class="rise" style="animation-delay:0.10s">
  <text x="38" y="122" fill="#0095D9" style="font-size:12px;font-weight:600;letter-spacing:.3px">AI · DASHBOARD</text>
  <text x="37" y="150" fill="#1D1D1F" style="font-size:23px;font-weight:700;letter-spacing:-.5px">AI Weather Dashboard</text>
  <text x="38" y="180" fill="#6E6E73" style="font-size:14.5px;letter-spacing:-.1px">OpenAI-powered weather insights with GPS location, a</text>
  <text x="38" y="201" fill="#6E6E73" style="font-size:14.5px;letter-spacing:-.1px">10-day forecast with charts and a glassmorphism UI.</text>
</g>
<g class="rise" style="animation-delay:0.20s"><rect x="38" y="236" width="67.36" height="26" rx="13" fill="rgba(120,120,128,0.12)"/><text x="71.68" y="253.5" text-anchor="middle" fill="#6E6E73" style="font-size:12px;font-weight:500">Next.js</text><rect x="113.36" y="236" width="60.88" height="26" rx="13" fill="rgba(120,120,128,0.12)"/><text x="143.8" y="253.5" text-anchor="middle" fill="#6E6E73" style="font-size:12px;font-weight:500">OpenAI</text><rect x="182.24" y="236" width="73.84" height="26" rx="13" fill="rgba(120,120,128,0.12)"/><text x="219.16000000000003" y="253.5" text-anchor="middle" fill="#6E6E73" style="font-size:12px;font-weight:500">Tailwind</text><rect x="264.08000000000004" y="236" width="73.84" height="26" rx="13" fill="rgba(120,120,128,0.12)"/><text x="301.00000000000006" y="253.5" text-anchor="middle" fill="#6E6E73" style="font-size:12px;font-weight:500">REST API</text></g>
</svg>
