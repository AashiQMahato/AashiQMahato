<title id="t">Most used languages</title>
<desc id="d">JavaScript 37.6%, TypeScript 36.9%, Jupyter Notebook 20.5%, CSS 2.1%, Python 1.7%, HTML 0.5%, C++ 0.3%, Other 0.5%</desc>
<defs><filter id="lSh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5.1" stdDeviation="7.7" flood-color="#000" flood-opacity="0.55"/></filter>
<linearGradient id="lEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,0.16)"/><stop offset=".18" stop-color="rgba(255,255,255,0.10)"/><stop offset="1" stop-color="rgba(255,255,255,0.10)"/></linearGradient><clipPath id="bar"><rect x="36" y="82" width="408" height="14" rx="7"/></clipPath></defs>
<style>
