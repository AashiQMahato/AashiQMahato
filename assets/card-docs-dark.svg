<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d">
<title id="t">Document Management App</title>
<desc id="d">Web · Dashboard. Authenticated dashboard for creating documents from typed templates, with dynamic, schema-validated forms. Built with React, TypeScript, TanStack Query, Tailwind.</desc>
