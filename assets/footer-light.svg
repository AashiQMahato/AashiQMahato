<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-labelledby="t d">
<title id="t">Let's build something good.</title>
<desc id="d">Open to opportunities and collaborations. Designed and built in Kathmandu, Nepal.</desc>
<defs><filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="40"/></filter>
<linearGradient id="ai" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9500"/><stop offset=".33" stop-color="#FF2D55"/><stop offset=".66" stop-color="#AF52DE"/><stop offset="1" stop-color="#0071E3"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI Variable Display','Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:'SF Mono',ui-monospace,SFMono-Regular,Menlo,'Cascadia Code',Consolas,'Liberation Mono',monospace}
.rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<ellipse cx="500" cy="190" rx="300" ry="34" fill="url(#ai)" opacity="0.28" filter="url(#glow)"/>
<g class="rise">
<text x="500" y="76" text-anchor="middle" fill="#1D1D1F" style="font-size:34px;font-weight:700;letter-spacing:-1px">Let's build something good.</text>
<text x="500" y="112" text-anchor="middle" fill="#6E6E73" style="font-size:16px;font-weight:500">Open to opportunities and collaborations.</text>
<text x="500" y="160" text-anchor="middle" fill="#86868B" style="font-size:12px;font-weight:500;letter-spacing:.2px">Designed and built in Kathmandu, Nepal.</text>
</g>
</svg>
