<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 170" width="882" height="170"
     role="img" aria-label="Contribution snake will appear here after the first workflow run">
  <title>Contribution snake — pending first workflow run</title>
  <defs>
    <linearGradient id="pEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0369A1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity=".4"/>
    </linearGradient>
  </defs>
  <style>
    .l{font-family:'Fira Code','SFMono-Regular',SFMono,Consolas,'Liberation Mono',Menlo,monospace;font-size:13px;fill:#1F2328;text-anchor:middle}
    .s{font-family:'Fira Code','SFMono-Regular',SFMono,Consolas,'Liberation Mono',Menlo,monospace;font-size:11.5px;fill:#59636E;text-anchor:middle}
    .p{animation:p 2.6s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.45}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important;transition:none!important}
    }
  </style>
  <rect width="882" height="170" rx="14" fill="#F6F8FA"/>
  <rect x="1" y="1" width="880" height="168" rx="13" fill="none" stroke="url(#pEdge)"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <text class="l p" x="441" y="81">Contribution snake</text>
  <text class="s" x="441" y="105">generating on first workflow run</text>
</svg>
