<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
<title id="t">Aashiq Kumar Mahato</title>
<desc id="d">Aashiq Kumar Mahato. Full-Stack Developer · Electronics Engineer. Bridging hardware and software. I build AI-powered web apps, end to end. Open to opportunities, based in Kathmandu, Nepal.</desc>
<defs>
<clipPath id="frame"><rect width="1000" height="400" rx="28"/></clipPath>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FF9500"/><stop offset=".33" stop-color="#FF2D55"/>
  <stop offset=".66" stop-color="#AF52DE"/><stop offset="1" stop-color="#0071E3"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="rgba(255,255,255,0.9)"/><stop offset=".25" stop-color="rgba(0,0,0,0.08)"/>
</linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI Variable Display','Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:'SF Mono',ui-monospace,SFMono-Regular,Menlo,'Cascadia Code',Consolas,'Liberation Mono',monospace}
.rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.name{font-size:66px;font-weight:700;letter-spacing:-2.2px;fill:#1D1D1F}
.role{font-size:15px;font-weight:600;letter-spacing:.2px}
.lede{font-size:23px;font-weight:500;letter-spacing:-.3px;fill:#6E6E73}
.meta{font-size:14px;font-weight:600;letter-spacing:-.1px}
.halo{transform-origin:72px 323px;animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(2.6);opacity:0}}
.drift{animation:drift 1.6s cubic-bezier(.22,1,.36,1) both}@keyframes drift{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<g clip-path="url(#frame)">
  <rect width="1000" height="400" fill="#F5F5F7"/>
  <g class="drift" filter="url(#glow)" opacity="0.55">
    <ellipse cx="600" cy="420" rx="200" ry="90" fill="#FF9500"/>
    <ellipse cx="760" cy="400" rx="220" ry="110" fill="#FF2D55"/>
    <ellipse cx="900" cy="330" rx="200" ry="120" fill="#AF52DE"/>
    <ellipse cx="1000" cy="230" rx="160" ry="120" fill="#0071E3"/>
  </g>
</g>
<rect x=".5" y=".5" width="999" height="399" rx="27.5" fill="none" stroke="url(#edge)"/>
<text class="role rise" style="animation-delay:0.05s" x="60" y="98" fill="url(#ai)">Full-Stack Developer · Electronics Engineer</text>
<text class="name rise" style="animation-delay:0.15s" x="56" y="170">Aashiq Kumar Mahato</text>
<text class="lede rise" style="animation-delay:0.27s" x="60" y="222">Bridging hardware and software.</text>
<text class="lede rise" style="animation-delay:0.35s" x="60" y="254">I build AI-powered web apps, end to end.</text>
<g class="rise" style="animation-delay:0.50s">
  <rect x="54" y="305" width="226.51999999999998" height="36" rx="18" fill="#28A745" fill-opacity="0.12"/>
  <circle class="halo" cx="72" cy="323" r="4.5" fill="#28A745"/>
  <circle cx="72" cy="323" r="4.5" fill="#28A745"/>
  <text class="meta" x="86" y="328" fill="#1E7B34">Open to opportunities</text>
  <g transform="translate(298.52 313)" fill="none" stroke="#6E6E73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 19s6-5.3 6-10A6 6 0 0 0 1 9c0 4.7 6 10 6 10z"/><circle cx="7" cy="9" r="2.2"/>
  </g>
  <text class="meta" x="320.52" y="328" fill="#6E6E73">Kathmandu, Nepal</text>
</g>
</svg>
