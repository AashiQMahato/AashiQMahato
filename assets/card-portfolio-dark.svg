  <text x="37" y="150" fill="#F5F5F7" style="font-size:23px;font-weight:700;letter-spacing:-.5px">Personal Portfolio</text>
  <text x="38" y="180" fill="#A1A1A6" style="font-size:14.5px;letter-spacing:-.1px">Responsive, performance-optimised portfolio with</text>
  <text x="38" y="201" fill="#A1A1A6" style="font-size:14.5px;letter-spacing:-.1px">smooth Framer Motion animations.</text>
