<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="1000" height="40"
     role="img" aria-label="Education" preserveAspectRatio="xMinYMid meet">
  <title>Education</title>
  <defs>
    <linearGradient id="hgT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset=".55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="hgBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="hgRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hgStreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F43F5E" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F43F5E" stop-opacity=".95"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hgClip"><rect x="130" y="21" width="870" height="2" rx="1"/></clipPath>
  </defs>
  <style>
    .t{font-family:Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:21px;font-weight:700;letter-spacing:-.3px;fill:url(#hgT)}
    .sweep{animation:sweep 11s cubic-bezier(.45,0,.55,1) infinite}
    @keyframes sweep{0%{transform:translateX(-200px)}100%{transform:translateX(870px)}}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important;transition:none!important}
      .sweep{display:none}
    }
  </style>
  <rect x="0" y="11" width="3" height="20" rx="1.5" fill="url(#hgBar)"/>
  <text class="t" x="16" y="28">Education</text>
  <rect x="130" y="21" width="870" height="2" rx="1" fill="url(#hgRule)"/>
  <g clip-path="url(#hgClip)">
    <rect class="sweep" x="130" y="21" width="200" height="2" fill="url(#hgStreak)"/>
  </g>
</svg>
