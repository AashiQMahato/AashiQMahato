# Renders GitHub stats, top languages and an isometric contribution calendar
# straight into this repo, so the README never depends on a public Vercel
# endpoint that can rate-limit (HTTP 402/503) and silently break.
#
# NOTE: metrics has no `config_theme` input. Light/dark is done entirely with
# `extras_css`, which is why each view is generated twice.
name: Profile metrics

on:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose: GitHub queues cron heavily at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stats (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AashiQMahato
          filename: assets/metrics/overview-dark.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kathmandu
          config_output: svg
          plugins_errors_fatal: no
          extras_css: |
            /* Calendar vars are declared on :root in the template; redeclaring
               them on svg too keeps the override closest to the day cells. */
            :root, svg {
              --color-calendar-graph-day-bg: #161B22;
              --color-calendar-graph-day-border: rgba(255,255,255,.06);
              --color-calendar-graph-day-L1-bg: #0C4A6E;
              --color-calendar-graph-day-L2-bg: #0284C7;
              --color-calendar-graph-day-L3-bg: #8B5CF6;
              --color-calendar-graph-day-L4-bg: #F43F5E;
            }
            /* 85 rules hard-set a colour, so inheritance alone is not enough.
               Bars and calendar cells use background-color and survive this. */
            svg, svg * { color: #C9D1D9 !important; }
            h2 { color: #0EA5E9 !important; }

      - name: Stats (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AashiQMahato
          filename: assets/metrics/overview-light.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kathmandu
          config_output: svg
          plugins_errors_fatal: no
          extras_css: |
            /* Calendar vars are declared on :root in the template; redeclaring
               them on svg too keeps the override closest to the day cells. */
            :root, svg {
              --color-calendar-graph-day-bg: #EBEDF0;
              --color-calendar-graph-day-border: rgba(27,31,35,.06);
              --color-calendar-graph-day-L1-bg: #BAE6FD;
              --color-calendar-graph-day-L2-bg: #38BDF8;
              --color-calendar-graph-day-L3-bg: #8B5CF6;
              --color-calendar-graph-day-L4-bg: #BE123C;
            }
            /* 85 rules hard-set a colour, so inheritance alone is not enough.
               Bars and calendar cells use background-color and survive this. */
            svg, svg * { color: #1F2328 !important; }
            h2 { color: #0369A1 !important; }

      - name: Languages (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AashiQMahato
          filename: assets/metrics/languages-dark.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          config_timezone: Asia/Kathmandu
          config_output: svg
          plugins_errors_fatal: no
          extras_css: |
            /* Calendar vars are declared on :root in the template; redeclaring
               them on svg too keeps the override closest to the day cells. */
            :root, svg {
              --color-calendar-graph-day-bg: #161B22;
              --color-calendar-graph-day-border: rgba(255,255,255,.06);
              --color-calendar-graph-day-L1-bg: #0C4A6E;
              --color-calendar-graph-day-L2-bg: #0284C7;
              --color-calendar-graph-day-L3-bg: #8B5CF6;
              --color-calendar-graph-day-L4-bg: #F43F5E;
            }
            /* 85 rules hard-set a colour, so inheritance alone is not enough.
               Bars and calendar cells use background-color and survive this. */
            svg, svg * { color: #C9D1D9 !important; }
            h2 { color: #8B5CF6 !important; }

      - name: Languages (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AashiQMahato
          filename: assets/metrics/languages-light.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          config_timezone: Asia/Kathmandu
          config_output: svg
          plugins_errors_fatal: no
          extras_css: |
            /* Calendar vars are declared on :root in the template; redeclaring
               them on svg too keeps the override closest to the day cells. */
            :root, svg {
              --color-calendar-graph-day-bg: #EBEDF0;
              --color-calendar-graph-day-border: rgba(27,31,35,.06);
              --color-calendar-graph-day-L1-bg: #BAE6FD;
              --color-calendar-graph-day-L2-bg: #38BDF8;
              --color-calendar-graph-day-L3-bg: #8B5CF6;
              --color-calendar-graph-day-L4-bg: #BE123C;
            }
            /* 85 rules hard-set a colour, so inheritance alone is not enough.
               Bars and calendar cells use background-color and survive this. */
            svg, svg * { color: #1F2328 !important; }
            h2 { color: #6D28D9 !important; }

      - name: Calendar (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AashiQMahato
          filename: assets/metrics/calendar-dark.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kathmandu
          config_output: svg
          plugins_errors_fatal: no
          extras_css: |
            /* Calendar vars are declared on :root in the template; redeclaring
               them on svg too keeps the override closest to the day cells. */
            :root, svg {
              --color-calendar-graph-day-bg: #161B22;
              --color-calendar-graph-day-border: rgba(255,255,255,.06);
              --color-calendar-graph-day-L1-bg: #0C4A6E;
              --color-calendar-graph-day-L2-bg: #0284C7;
              --color-calendar-graph-day-L3-bg: #8B5CF6;
              --color-calendar-graph-day-L4-bg: #F43F5E;
            }
            /* 85 rules hard-set a colour, so inheritance alone is not enough.
               Bars and calendar cells use background-color and survive this. */
            svg, svg * { color: #C9D1D9 !important; }
            h2 { color: #F43F5E !important; }

      - name: Calendar (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AashiQMahato
          filename: assets/metrics/calendar-light.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kathmandu
          config_output: svg
          plugins_errors_fatal: no
          extras_css: |
            /* Calendar vars are declared on :root in the template; redeclaring
               them on svg too keeps the override closest to the day cells. */
            :root, svg {
              --color-calendar-graph-day-bg: #EBEDF0;
              --color-calendar-graph-day-border: rgba(27,31,35,.06);
              --color-calendar-graph-day-L1-bg: #BAE6FD;
              --color-calendar-graph-day-L2-bg: #38BDF8;
              --color-calendar-graph-day-L3-bg: #8B5CF6;
              --color-calendar-graph-day-L4-bg: #BE123C;
            }
            /* 85 rules hard-set a colour, so inheritance alone is not enough.
               Bars and calendar cells use background-color and survive this. */
            svg, svg * { color: #1F2328 !important; }
            h2 { color: #BE123C !important; }
