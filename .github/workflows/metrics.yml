# Renders the GitHub analytics cards (activity, languages, contribution calendar)
# into assets/metrics with .github/scripts/metrics.mjs.
#
# Uses the workflow's built-in token, so no secret is required. This replaced
# lowlighter/metrics, which refuses to run without a personal access token and
# failed every night because the METRICS_TOKEN secret was never created.
# Optional: add a METRICS_TOKEN secret (classic PAT, read:user) to also count
# private contributions; it is picked up automatically.
name: Profile metrics

on:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose: GitHub queues cron heavily at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/metrics.mjs"
      - ".github/scripts/theme.mjs"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render metrics
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
        run: node .github/scripts/metrics.mjs "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics
          if git diff --cached --quiet; then
            echo "Metrics unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile metrics [skip ci]"
          # Both workflows commit to main and can run at the same time, so rebase
          # onto whatever landed meanwhile and retry instead of failing the run.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 3))
          done
          exit 1
