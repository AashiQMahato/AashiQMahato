# Generates the contribution snake and commits it into assets/, so the README
# can reference it with a plain relative path instead of an "output" branch.
name: Contribution snake

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # "#" is literal inside a YAML block scalar, so the hex colours are safe here.
      - name: Render snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#BF5AF2&color_dots=#161B22,#0B3260,#0A5BB0,#0A74E0,#0A84FF
            dist/snake-light.svg?palette=github-light&color_snake=#AF52DE&color_dots=#EBEDF0,#B3D4FF,#80B5FF,#4096FF,#0071E3

      - name: Commit if changed
        run: |
          set -euo pipefail
          mkdir -p assets
          cp dist/snake-dark.svg  assets/snake-dark.svg
          cp dist/snake-light.svg assets/snake-light.svg
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-dark.svg assets/snake-light.svg
          if git diff --cached --quiet; then
            echo "Snake unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh contribution snake [skip ci]"
          # Both workflows commit to main and can run at the same time, so rebase
          # onto whatever landed meanwhile and retry instead of failing the run.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 3))
          done
          exit 1
